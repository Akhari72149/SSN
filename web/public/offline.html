<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#302f2d" />
    <title>Safer Spaces · Offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f2f0ed; color: #292927; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(430px, 100%); background: #fff; border: 1px solid #dedbd6; padding: 32px; box-shadow: 0 8px 30px #2d28230d; }
      .mark { width: 54px; height: 54px; border: 8px solid #ef786d; border-radius: 50%; display: grid; place-items: center; }
      .mark::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #ef786d; }
      h1 { margin: 24px 0 10px; font: 400 30px Georgia, serif; }
      p { color: #716f6b; line-height: 1.55; }
      button { width: 100%; min-height: 48px; margin-top: 18px; border: 0; border-radius: 4px; background: #302f2d; color: white; font: 700 15px inherit; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>You’re offline</h1>
      <p>The Safer Spaces app is installed, but this page has not connected yet. Reconnect to securely sync the current event.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
